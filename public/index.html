<style>
  #mrfrank-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: linear-gradient(135deg, #0d0f14 0%, #13161f 100%);
    border-top: 1px solid rgba(108,99,255,0.3);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: #64748b;
    letter-spacing: 0.02em;
    backdrop-filter: blur(8px);
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
  }
  #mrfrank-footer a {
    color: #6c63ff;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.15s;
  }
  #mrfrank-footer a:hover { color: #00d4ff; }
  #mrfrank-footer .footer-heart {
    color: #ef4444;
    animation: heartbeat 1.4s ease infinite;
    display: inline-block;
  }
  #mrfrank-footer .footer-divider {
    width: 1px;
    height: 14px;
    background: rgba(255,255,255,0.1);
    margin: 0 8px;
  }
  #mrfrank-footer .footer-year {
    color: #94a3b8;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.2); }
    28% { transform: scale(1); }
    42% { transform: scale(1.15); }
    70% { transform: scale(1); }
  }
  body { padding-bottom: 44px !important; }
</style>
<script>
  (function() {
    function injectFooter() {
      if (document.getElementById('mrfrank-footer')) return;
      var footer = document.createElement('footer');
      footer.id = 'mrfrank-footer';
      var year = new Date().getFullYear();
      footer.innerHTML = `
        <span>Made with</span>
        <span class="footer-heart">&hearts;</span>
        <span>by</span>
        <a href="#">Mr Frank</a>
        <span class="footer-divider"></span>
        <span class="footer-year">&copy; ` + year + ` MrFrank CDN &mdash;</span>
      `;
      document.body.appendChild(footer);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', injectFooter);
    } else {
      injectFooter();
    }
    // Fallback for dynamically written content
    setTimeout(injectFooter, 500);
    window.addEventListener('load', injectFooter);
  })();
</script>
